name: Build CV and publish to website

on:
  push:
    branches: [main, master]   # match the CV repo's default branch
  workflow_dispatch:           # lets you run it manually too

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CV source
        uses: actions/checkout@v4

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          # latexmk_use_xelatex: true   # uncomment if your CV uses fontspec/custom fonts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check CV hyperlinks (fails build on dead links)
        # Parses every \href / \url in main.tex and verifies each URL.
        # DEAD links (404/410, unreachable host) fail the build and block publish.
        # WARN links (anti-bot 403/999, SSL, transient 5xx) are reported but don't fail.
        # To also fail on WARN, set CHECK_LINKS_FAIL_ON_WARN=1 below.
        run: python3 scripts/check_links.py main.tex

      - name: Publish PDF to website repo
        env:
          TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            https://x-access-token:${TOKEN}@github.com/atillasaadat/personal_website.git website
          cp main.pdf website/public/files/Atilla_Saadat_CV.pdf
          cd website
          git config user.name "cv-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "CV unchanged — nothing to publish."
            exit 0
          fi
          git add public/files/Atilla_Saadat_CV.pdf
          git commit -m "chore: update CV from Overleaf"
          git push
